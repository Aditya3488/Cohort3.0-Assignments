<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Portfolio UI</title>

    <!-- REMIX ICON -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>Clients</h3>
            <h3>Research</h3>
            <h3>Portfolio</h3>
            <h3>Podcast</h3>
        </div>

        <!-- PROFILE -->

        <div class="card profile">
            <div class="cut-shape"></div>
            <div class="about">
                <i class="ri-command-line"></i>
                <span>About Me</span>
            </div>
            <!-- IMAGE -->
            <div class="profile-circle">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop"
                    alt="">
            </div>
            <!-- NAME -->
            <h1> Im,<br>Jon<br>Daniel</h1>
            <!-- EMAIL -->
            <div class="email">
                inquiry@jondaniel.design
                <i class="ri-mail-line"></i>
            </div>
            <!-- BADGE -->
            <div class="badge"> UI DESIGN PORTFOLIO</div>
        </div>
        <!-- TITLE -->
        <div class="title">
            <h1>Portfolio</h1>
        </div>
        <!-- VIDEO CARD -->
        <div class="card video">
            <img src="https://images.unsplash.com/photo-1497206365907-f5e630693df0?q=80&w=1200&auto=format&fit=crop"
                alt="">
            <div class="play">
                <i class="ri-play-fill"></i>
            </div>
        </div>

        <!-- RIGHT CARDS -->
        <div class="right">
            <!-- PROJECT -->
            <div class="small-card project">
                <i class="ri-corner-right-up-line corner"></i>
                <h1>251</h1>
                <p>Projects</p>
            </div>
            <!-- AWARD -->
            <div class="small-card award">
                <i class="ri-corner-right-up-line corner"></i>
                <h1>156</h1>
                <p>Awards</p>
            </div>
        </div>
        <!-- BOTTOM -->
        <div class="bottom">
            <!-- APPLE -->
            <div class="card apple">
                <i class="ri-apple-fill"></i>
                <h2>Clients</h2>
            </div>
            <!-- BLACK ORB -->
            <div class="card orb-card">
                <div class="orb">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=1200&auto=format&fit=crop"
                        alt="">
                </div>
            </div>
            <!-- DESIGN -->
            <div class="card design">
                <i class="ri-corner-right-up-line corner"></i>
                <h1>172</h1>
                <p>Global Design<br> Awards.</p>
            </div>
        </div>
    </div>
</body>

</html>
